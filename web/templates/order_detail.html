{{template "head" .}}
<section class="narrow">
  <h2>订单详情</h2>
  {{with .Data.Order}}
  <div class="panel">
    <dl class="kv">
      <dt>订单 ID</dt><dd>{{.ID}}</dd>
      <dt>订单号</dt><dd class="mono">{{.OrderNo}}</dd>
      <dt>商品</dt><dd>{{.GoodsName}}</dd>
      <dt>金额</dt><dd>{{money .AmountCent}} 元</dd>
      <dt>状态</dt><dd><span class="badge s{{.Status}}">{{.StatusText}}</span></dd>
      <dt>下单人</dt><dd>{{.Username}}</dd>
      <dt>创建时间</dt><dd>{{datetime .CreatedAt}}</dd>
    </dl>
    {{if eq .Status 1}}
    <form method="post" action="/orders/{{.ID}}/cancel">
      <input type="hidden" name="csrf_token" value="{{$.CSRF}}">
      <button class="btn danger" type="submit">取消订单</button>
    </form>
    {{end}}
    <p><a href="/orders">返回列表</a></p>
  </div>
  {{end}}
</section>
{{template "foot" .}}
