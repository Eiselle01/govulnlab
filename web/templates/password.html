{{template "head" .}}
<section class="narrow">
  <h2>修改密码</h2>
  {{with .Data.Error}}<p class="alert">{{.}}</p>{{end}}
  {{with .Data.OK}}<p class="ok">{{.}}</p>{{end}}
  <form method="post" action="/account/password" class="stack">
    <input type="hidden" name="csrf_token" value="{{.CSRF}}">
    <label>旧密码<input name="oldpwd" type="password" required maxlength="72"></label>
    <label>新密码<input name="newpwd" type="password" required minlength="10" maxlength="72"></label>
    <button class="btn primary" type="submit">提交修改</button>
  </form>
  <p class="muted">修改成功后当前会话失效，需要重新登录——这是权限变更后的标准处理。</p>
</section>
{{template "foot" .}}
