<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>用户登录</title>
</head>

<body>
    <h2>用户登录</h2>
    <div>
        用户名：<input id="username" type="text" placeholder="输入用户名">
    </div>
    <div style="margin-top:8px">
        密码：<input id="password" type="password" placeholder="输入密码">
    </div>
    <div style="margin-top:12px">
        <button id="loginBtn">登录</button>
    </div>

    <script>
        const loginBtn = document.getElementById("loginBtn");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");

        loginBtn.addEventListener("click", async function () {
            console.log("✅按钮被点击了！");
            let username = usernameInput.value.trim();
            let password = passwordInput.value.trim();
            console.log("用户名：", usernameInput);
            console.log("密码：", passwordInput);
            if (!username || !password) {
                console.log("用户名密码不能为空");
                return;
            }

            try {
                const resp = await fetch("/login", {
                    method: "POST",
                    credentials: "include",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                    },
                    body: "username=" + encodeURIComponent(username) + "&password=" + encodeURIComponent(password)
                });
                console.log("响应状态：", resp.status);
                // const data = resp.json()

                // console.log("后端返回内容：", data);

                //     // 判断后端业务逻辑是否成功（JSON里的ok字段）
                //     if (data.ok) {
                //         console.log("登录成功，msg：", data.msg);
                //         window.location.href = "/profile";
                //     } else {
                //         // 业务失败：账号密码错之类
                //         alert("登录失败:" + data.msg);
                //     }

                // } catch (err) {
                //     // 网络错误、后端返回不是合法JSON才会进到这里
                //     console.error("请求异常", err);
                //     alert("请求失败，请检查网络连接");
                // } console.log("status=", res.status)
                // 先把原始文本打出来，看看后端到底发了啥
                const rawText = await resp.text()
                console.log("后端原始返回：", rawText)
                // 手动尝试解析
                const data = JSON.parse(rawText)
                console.log("解析后的data：", data)
                if (data.ok) {
                    window.location.href = "/profile"
                } else {
                    alert("登录失败:" + data.msg)
                }
            } catch (err) {
                console.error("异常：", err)
                alert("请求异常:" + err)
            }
        })
    </script>
</body>

</html>
