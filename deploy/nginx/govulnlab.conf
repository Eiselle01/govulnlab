# GoVulnLab 的 Nginx 前置配置（TLS 终止 + 反向代理）
#
# 安装：
#   sudo cp deploy/nginx/govulnlab.conf /etc/nginx/sites-available/govulnlab.conf
#   sudo ln -s /etc/nginx/sites-available/govulnlab.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书用 certbot 申请：sudo certbot --nginx -d govulnlab.example.com

# 边缘限流：挡住明显的扫描/爬虫，应用内的令牌桶再做一层业务限流（双层限流）
limit_req_zone $binary_remote_addr zone=gvl_api:10m rate=20r/s;

upstream govulnlab_app {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name govulnlab.example.com;
    # ACME 校验放行，其余强制跳 HTTPS
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name govulnlab.example.com;

    ssl_certificate     /etc/letsencrypt/live/govulnlab.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/govulnlab.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 应用自己也会设置这些头；这里兜底，防止某天应用挂掉时裸奔
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 2m;

    # 真实客户端 IP 传给应用；配合 security.trust_proxy=true 才生效
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host             $host;

    location / {
        limit_req zone=gvl_api burst=40 nodelay;
        proxy_pass http://govulnlab_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # 探针不记录访问日志，避免刷日志
    location = /healthz {
        access_log off;
        proxy_pass http://govulnlab_app;
    }
    location = /readyz {
        access_log off;
        proxy_pass http://govulnlab_app;
    }

    # 静态资源交给 Nginx 直出（应用内也支持 /static/，此处为可选优化）
    location /static/ {
        proxy_pass http://govulnlab_app;
        expires 7d;
    }
}
