name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 直接读 go.mod 里的 go 指令，避免 CI 与本地版本漂移
          go-version-file: go.mod
          cache: true

      - name: 校验依赖清单干净
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: 格式检查
        run: |
          unformatted=$(gofmt -l cmd internal migrations web)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 单元测试（含竞态检测）
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: 覆盖率摘要
        run: go tool cover -func=coverage.out | tail -n 1

      - name: 构建二进制
        run: CGO_ENABLED=0 go build -trimpath -o bin/govulnlab ./cmd/govulnlab

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: govulnlab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
